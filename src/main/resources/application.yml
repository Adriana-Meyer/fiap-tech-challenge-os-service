spring:
  application:
    name: workshop-management

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

  datasource:
    url: jdbc:mysql://localhost:3306/workshop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: workshop
    password: workshop123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-64-characters-long-for-hs512-ok}
    expiration-ms: 86400000
  webhook:
    token: ${WEBHOOK_TOKEN:dev-only-webhook-token-change-me}
  messaging:
    # Off in tests that do not exercise the queues: the listener connects to SQS when the app starts.
    enabled: ${MESSAGING_ENABLED:true}
    # Fed by the saga-events topic (os-infrastructure).
    events-queue: ${EVENTS_QUEUE:os-saga-events}
    billing-commands-queue: ${BILLING_COMMANDS_QUEUE:billing-commands}
    inventory-commands-queue: ${INVENTORY_COMMANDS_QUEUE:inventory-commands}
    execution-commands-queue: ${EXECUTION_COMMANDS_QUEUE:execution-commands}

  inventory:
    # Inventory owns the supplies; the OS looks them up when an item is added.
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fiap.workshop: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
